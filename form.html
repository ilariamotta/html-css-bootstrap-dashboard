<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aggiungi libro</title>
    <!-- bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- bootstrap icon -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- css -->
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <!-- header -->
    <section>
        <nav class="navbar navbar-expand-lg bg-body-tertiary" data-bs-theme="dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="#"><img src="./img/duck.png" class="img-logo-duck" alt="logo papera"></a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="#">Catalogo Libri</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Anagrafica Utenti</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Storico Prestiti</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Help</a>
                        </li>
                    </ul>
                    <form class="d-flex" role="search">
                        <input class="form-control me-2 bg-light text-body-tertiary" type="search" data-bs-theme="light"
                            placeholder="Cerca..." aria-label="Search" />
                        <button class="btn btn-outline-light" type="submit">Cerca</button>
                    </form>

                </div>
            </div>
        </nav>
    </section>
    <!-- fine header -->
    <!-- main -->
    <!-- titolo -->
    <div class="container">
        <h1 class="my-4">Nuovo Libro</h1>
    </div>
    <!-- inizio form -->
    <form action="" class="container">
        <div class="row">
            <div class="col-6 mb-3">
                <div><label class="form-label fw-semibold" for="nome-autore">Nome Autore</label>
                    <input class="form-control" type="text" id="nome-autore" placeholder="Inserisci il nome dell'autore"
                        required>
                </div>
            </div>
            <div class="col-6 mb-3">
                <div><label class="form-label fw-semibold" for="cognome-autore">Cognome Autore</label>
                    <input class="form-control" type="text" id="cognome-autore"
                        placeholder="Inserisci il cognome dell'autore" required>
                </div>
            </div>

            <div class="col-12 mb-3">
                <div><label class="form-label fw-semibold" for="titolo-libro">Titolo</label>
                    <input class="form-control" type="text" id="titolo-libro"
                        placeholder="Inserisci il titolo del libro" required>
                    <p class="text-secondary fs-6">Titolo versione italiana</p></div>
            </div>
            <div class="col-12 col-lg-4 mb-3">
                <label class="form-label fw-semibold" for="genere">Genere</label>
                <div><select class="form-select" name="" id="genere">
                    <option value="" selected disabled>Seleziona il genere</option>
                    <option value="1">fantascienza</option>
                    <option value="2">fantasy</option>
                </select>
                </div>
            </div>
            <div class="col-12 col-lg-4 mb-3">
                <div><label class="form-label fw-semibold" for="data">Anno di pubblicazione</label>
                    <input class="form-control" type="number" id="data" placeholder="Inserisci l'anno"></div>
            </div>
            <div class="col-12 col-lg-4 mb-3">
                <div><label class="form-label fw-semibold" for="isbn">ISBN&#35;</label>
                    <input class="form-control" type="number" id="isbn" placeholder="Inserisci il codice ISBN&#35;" min="13" max="13" required></div>
            </div>
            <hr class="my-3">
            <div class="col-12 mb-3">
                <div><label class="form-label fw-semibold" for="note">Note</label>
                <textarea class="form-control" id="note" rows="3" placeholder="Inserisci eventuali note sul libro"></textarea></div>
            </div>
            <div><input class="form-check-input mb-4" type="checkbox" name="" id="digitale">
            <label for="digitale">Disponibile anche in digitale</label></div>
            <div><button class="btn btn-primary mb-4">Aggiungi Libro</button></div>
    </form>
    </div>








    <!-- fine main -->




    <!-- javascript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>

</html>
